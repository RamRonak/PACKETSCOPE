<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagon / Target Ring -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="none" stroke="url(#scopeGrad)" stroke-width="3" opacity="0.8" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  <circle cx="50" cy="50" r="20" fill="none" stroke="#0072ff" stroke-width="2" />
  <!-- Reticle Crosshairs -->
  <line x1="50" y1="12" x2="50" y2="30" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="70" x2="50" y2="88" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="50" x2="30" y2="50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <line x1="70" y1="50" x2="88" y2="50" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
  <!-- Center Packet Diamond Node -->
  <polygon points="50,42 58,50 50,58 42,50" fill="#00f0ff" filter="url(#glow)" />
</svg>
